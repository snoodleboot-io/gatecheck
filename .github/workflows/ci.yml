# CI — runs on every PR and push to main.
#
# Gating jobs (per CONTRIBUTING.md § "Running checks locally"):
#   - python-checks : ruff (lint + format) + mypy + pytest on Python 3.11 and 3.12
#   - windows-checks: the same Python gates on windows-latest
#   - rust-checks   : cargo fmt --check + clippy -D warnings + cargo test
#   - docs-build    : mkdocs build --strict (a dead internal link fails the PR)
#   - self-host     : gatecheck run full --all-files — the tool gating itself
#
# The Python package depends on the `gatecheck-core` native extension, which is
# NOT published to PyPI — CI builds it from gatecheck-rs/ with maturin and
# installs the resulting wheel before installing gatecheck itself.
#
# Follow-up (not yet gating): cross-platform build-wheels smoke tests.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-checks:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatecheck-rs

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Build and install the native core (gatecheck_core)
        run: |
          uv pip install --python .venv/bin/python maturin
          .venv/bin/maturin build --release --interpreter .venv/bin/python --manifest-path gatecheck-rs/Cargo.toml --out dist
          uv pip install --python .venv/bin/python dist/gatecheck_core-*.whl

      - name: Install gatecheck + dev dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff (lint)
        run: .venv/bin/ruff check src tests scripts

      - name: Ruff (format check)
        run: .venv/bin/ruff format --check src tests scripts

      - name: Mypy
        run: .venv/bin/mypy

      - name: Pytest
        # Deselect @pytest.mark.network tests — CI must not depend on a live PyPI /
        # external index. Run network-marked tests separately (local / scheduled).
        run: .venv/bin/pytest -m "not network"

  windows-checks:
    name: windows (${{ matrix.python-version }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatecheck-rs

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Build and install the native core (gatecheck_core)
        run: |
          uv pip install --python .venv/Scripts/python.exe maturin
          .venv/Scripts/maturin.exe build --release --interpreter .venv/Scripts/python.exe --manifest-path gatecheck-rs/Cargo.toml --out dist
          uv pip install --python .venv/Scripts/python.exe "$(ls dist/gatecheck_core-*.whl)"

      - name: Install gatecheck + dev dependencies
        run: uv pip install --python .venv/Scripts/python.exe -e ".[dev]"

      - name: Ruff (lint)
        run: .venv/Scripts/python.exe -m ruff check src tests scripts

      - name: Mypy
        run: .venv/Scripts/python.exe -m mypy

      - name: Pytest
        # Same non-network suite as Linux — the fakes are now cross-platform.
        run: .venv/Scripts/python.exe -m pytest -m "not network"

  rust-checks:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatecheck-rs

      - name: Cargo fmt
        run: cargo fmt --check --manifest-path gatecheck-rs/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path gatecheck-rs/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path gatecheck-rs/Cargo.toml

  docs-build:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-revision-date-localized reads commit history for page dates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install ONLY the docs extra, not the project: gatecheck depends on the
      # gatecheck-core native extension, which is built from source rather than
      # published, and mkdocs does not need to import gatecheck at all. Reading the
      # list out of pyproject.toml keeps it from drifting.
      - name: Install docs dependencies
        run: |
          python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          reqs = data['project']['optional-dependencies']['docs']
          pathlib.Path('docs-requirements.txt').write_text('\n'.join(reqs) + '\n')
          "
          pip install -r docs-requirements.txt

      # --strict turns a dead internal link into a build failure. A broken link is a
      # bug in a documentation site, and far cheaper to catch here than after publish.
      - name: Build docs
        run: mkdocs build --strict

  # gatecheck checks gatecheck: run this repo's own check.toml through the runner.
  # This is the dogfood gate — it exercises the pypi source path (an isolated,
  # uv-built ruff), the project/system paths (mypy, cargo), the DAG scheduler, and
  # the report end to end. The direct python-checks / rust-checks jobs remain the
  # trusted baseline; this runs alongside them until it has proven itself.
  self-host:
    name: self-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gatecheck-rs

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: uv venv --python 3.12 .venv

      - name: Build and install the native core (gatecheck_core)
        run: |
          uv pip install --python .venv/bin/python maturin
          .venv/bin/maturin build --release --interpreter .venv/bin/python --manifest-path gatecheck-rs/Cargo.toml --out dist
          uv pip install --python .venv/bin/python dist/gatecheck_core-*.whl

      - name: Install gatecheck + dev dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      # The `full` group: ruff (pypi, isolated), ruff-format, mypy (project),
      # cargo-fmt-check + cargo-clippy (system). Hooks are check-mode, so a problem
      # fails the run rather than rewriting the tree.
      - name: gatecheck run full --all-files
        run: .venv/bin/gatecheck run full --all-files

      # Defense in depth: a check-mode hook must not have modified anything. If this
      # ever fails, a hook is auto-fixing when it should be verifying.
      - name: Working tree is unchanged
        run: git diff --exit-code
