# Release — trunk-based, PyPI-derived versioning (STY-0044 / GAT-53).
#
# There are no version tags. The version is COMPUTED at build time from PyPI history
# plus the GitHub event (see .github/scripts/calculate_version.py) and injected into
# both distributions before they build (.github/scripts/inject_version.sh):
#   • gatecheck-core — the PyO3 extension, built by maturin as a platform wheel matrix
#     (per-Python cp311/cp312; no abi3). Version from gatecheck-rs/Cargo.toml.
#   • gatecheck      — the pure-Python host, built by hatchling from __about__.py.
#     Pins gatecheck-core==<same version>.
#
# Flow:
#   • PR → main (opened/synchronized)  → build 0.<minor>.<PR>.dev<run> → TestPyPI.
#   • push → main (a merge landed)     → build 0.<minor>.0            → PyPI, but only
#     after manual approval of the `release` environment (the human checkpoint).
#   • workflow_dispatch                → rehearse; choose testpypi (default) or pypi.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API tokens. See RELEASING.md.

name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (rehearsal)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: gatecheck
  # MAJOR is pinned here — the only place it can be bumped. gatecheck stays on 0.x.
  MAJOR_VERSION: "0"
  # cp311/cp312 wheels — must track [project].requires-python and the CI test matrix.
  PYTHON_INTERPRETERS: "3.11 3.12"

jobs:
  # ── version ──────────────────────────────────────────────────────
  # Computed once, up front, so every build job injects the identical version and no
  # two matrix legs race PyPI to different answers.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_publish_testpypi: ${{ steps.v.outputs.should_publish_testpypi }}
      should_publish_pypi: ${{ steps.v.outputs.should_publish_pypi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: python .github/scripts/calculate_version.py
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          MAJOR_VERSION: ${{ env.MAJOR_VERSION }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_ACTION: ${{ github.event.action || '' }}

  # ── build gatecheck-core (compiled) ──────────────────────────────
  build-core:
    name: core ${{ matrix.target }} (${{ matrix.runner }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: windows-latest, target: x64, manylinux: "" }
          - { runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { runner: macos-14, target: aarch64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12

      - name: Inject version
        shell: bash
        run: bash .github/scripts/inject_version.sh "${{ needs.version.outputs.version }}"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --out dist
            --manifest-path gatecheck-rs/Cargo.toml
            --interpreter ${{ env.PYTHON_INTERPRETERS }}

      - uses: actions/upload-artifact@v4
        with:
          name: core-wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-core-sdist:
    name: core sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject version
        shell: bash
        run: bash .github/scripts/inject_version.sh "${{ needs.version.outputs.version }}"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path gatecheck-rs/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: core-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── build gatecheck (pure Python host) ───────────────────────────
  build-host:
    name: host wheel + sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inject version
        shell: bash
        run: bash .github/scripts/inject_version.sh "${{ needs.version.outputs.version }}"
      - run: pip install build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: host-dist
          path: dist/*
          if-no-files-found: error

  # ── smoke test: install both, together, in a clean venv ──────────
  smoke:
    name: smoke ${{ matrix.os }}
    needs: [build-core, build-core-sdist, build-host]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Collect every built wheel into one directory; pip picks the one that matches
      # this platform + Python. Deps (click, rich, …) come from PyPI as normal.
      - name: Gather wheels
        shell: bash
        run: |
          mkdir -p wheelhouse
          find artifacts -name '*.whl' -exec cp {} wheelhouse/ \;
          ls -1 wheelhouse

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # --find-links for our wheels; PyPI still reachable for runtime deps.
          pip install --find-links wheelhouse gatecheck
          gatecheck --version
          gc --version
          python -c "import gatecheck_core; print('gatecheck_core import OK')"

  # ── publish to TestPyPI (PR previews) ────────────────────────────
  publish-testpypi:
    name: publish TestPyPI
    needs: [version, smoke]
    if: >-
      needs.version.outputs.should_publish_testpypi == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gatecheck/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage distributions
        run: |
          mkdir -p dist
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -1 dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── publish to PyPI (push to main, behind manual approval) ───────
  publish-pypi:
    name: publish PyPI
    needs: [version, smoke]
    if: >-
      needs.version.outputs.should_publish_pypi == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    # The release environment must require a manual reviewer — this is the gate.
    environment:
      name: release
      url: https://pypi.org/project/gatecheck/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # gatecheck-core: every platform wheel + the sdist.
      - name: Stage gatecheck-core
        run: |
          mkdir -p dist-core
          find artifacts -path '*core-wheels*/*.whl' -exec cp {} dist-core/ \;
          find artifacts -path '*core-sdist*/*.tar.gz' -exec cp {} dist-core/ \;
          ls -1 dist-core

      # gatecheck: the universal wheel + sdist.
      - name: Stage gatecheck
        run: |
          mkdir -p dist-host
          find artifacts -path '*host-dist*/*' \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist-host/ \;
          ls -1 dist-host

      # Publish the core first so the host's dependency resolves for anyone who installs
      # the instant the host lands. skip-existing: the core wheels only change when the
      # unified version bumps, so a re-run must not error on an already-present file.
      - name: Publish gatecheck-core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-core
          skip-existing: true

      - name: Publish gatecheck
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-host
          skip-existing: true
