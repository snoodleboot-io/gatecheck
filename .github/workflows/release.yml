# Release — build both distributions, smoke-test them, and publish to PyPI.
#
# gatecheck ships as TWO packages:
#   • gatecheck-core — the PyO3 extension, built by maturin as a platform wheel
#     matrix (per-Python cp311/cp312; no abi3). Version from gatecheck-rs/Cargo.toml.
#   • gatecheck      — the pure-Python host, built by hatchling. One universal wheel.
#     Version from the git tag via hatch-vcs. Depends on gatecheck-core.
#
# `pip install gatecheck` then resolves the right core wheel for the platform.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API tokens in the repo — and is
# gated behind the `release` environment, which must require manual approval (the PRD's
# human checkpoint before a public release). See RELEASING.md for the one-time PyPI and
# environment setup.
#
# Trigger:
#   • push a tag vX.Y.Z          → publish to PyPI
#   • workflow_dispatch          → rehearse; choose testpypi (default) or pypi

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

env:
  # cp311/cp312 wheels — must track [project].requires-python and the CI test matrix.
  PYTHON_INTERPRETERS: "3.11 3.12"

jobs:
  # ── version ──────────────────────────────────────────────────────
  # The tag is the version. A manual run has no tag, so it builds a dev version and
  # can only target TestPyPI.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc.].*)?$ ]]; then
              echo "::error::tag '${GITHUB_REF_NAME}' is not a valid X.Y.Z version"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=(dev, from workflow_dispatch)" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

  # ── build gatecheck-core (compiled) ──────────────────────────────
  build-core:
    name: core ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: windows-latest, target: x64, manylinux: "" }
          - { runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { runner: macos-14, target: aarch64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --out dist
            --manifest-path gatecheck-rs/Cargo.toml
            --interpreter ${{ env.PYTHON_INTERPRETERS }}

      - uses: actions/upload-artifact@v4
        with:
          name: core-wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-core-sdist:
    name: core sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path gatecheck-rs/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: core-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── build gatecheck (pure Python host) ───────────────────────────
  build-host:
    name: host wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs the tag history to derive the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: host-dist
          path: dist/*
          if-no-files-found: error

  # ── smoke test: install both, together, in a clean venv ──────────
  smoke:
    name: smoke ${{ matrix.os }}
    needs: [build-core, build-core-sdist, build-host]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Collect every built wheel into one directory; pip picks the one that matches
      # this platform + Python. Deps (click, rich, …) come from PyPI as normal.
      - name: Gather wheels
        shell: bash
        run: |
          mkdir -p wheelhouse
          find artifacts -name '*.whl' -exec cp {} wheelhouse/ \;
          ls -1 wheelhouse

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # --find-links for our wheels; PyPI still reachable for runtime deps.
          pip install --find-links wheelhouse gatecheck
          gatecheck --version
          gc --version
          python -c "import gatecheck_core; print('gatecheck_core import OK')"

  # ── publish to PyPI (manual approval) ────────────────────────────
  publish:
    name: publish (${{ github.event.inputs.target || 'pypi' }})
    needs: [version, smoke]
    runs-on: ubuntu-latest
    # The release environment must require a manual reviewer — this is the gate.
    environment:
      name: release
      url: https://pypi.org/project/gatecheck/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # gatecheck-core: every platform wheel + the sdist, into one directory.
      - name: Stage gatecheck-core
        run: |
          mkdir -p dist-core
          find artifacts -path '*core-wheels*/*.whl' -exec cp {} dist-core/ \;
          find artifacts -path '*core-sdist*/*.tar.gz' -exec cp {} dist-core/ \;
          ls -1 dist-core

      # gatecheck: the universal wheel + sdist.
      - name: Stage gatecheck
        run: |
          mkdir -p dist-host
          find artifacts -path '*host-dist*/*' \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist-host/ \;
          ls -1 dist-host

      # Publish the core first so the host's dependency resolves for anyone who
      # installs the instant the host lands. skip-existing: the core only changes when
      # its Cargo version bumps, so re-tagging a Python-only release must not error.
      - name: Publish gatecheck-core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-core
          skip-existing: true
          repository-url: ${{ (github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/') || '' }}

      - name: Publish gatecheck
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-host
          repository-url: ${{ (github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/') || '' }}

  # ── GitHub release ───────────────────────────────────────────────
  github-release:
    name: github release
    needs: [version, publish]
    if: needs.version.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release-assets/*
