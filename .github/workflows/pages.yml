# Pages — build the site and deploy it to GitHub Pages on push to main.
#
# Layout of the published site:
#   /            → the marketing landing page (website/)
#   /docs/       → the MkDocs technical docs (docs/ + mkdocs.yml)
#
# PRs are NOT deployed. The `docs-build` job in ci.yml already runs
# `mkdocs build --strict` on every PR, so a broken docs build fails there first.
# This workflow is deploy-only, gated on main.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: the deploy needs to write Pages and mint an OIDC token; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-revision-date-localized reads commit history for per-page dates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install ONLY the docs extra — mkdocs never imports hooksmith, and the package
      # depends on the unpublished hooksmith-core native extension. Read the list out
      # of pyproject.toml so it cannot drift from the single source of truth.
      - name: Install docs dependencies
        run: |
          python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          reqs = data['project']['optional-dependencies']['docs']
          pathlib.Path('docs-requirements.txt').write_text('\n'.join(reqs) + '\n')
          "
          pip install -r docs-requirements.txt

      # Assemble the published tree: marketing at the root, docs nested under /docs/.
      - name: Build the site
        run: |
          set -euo pipefail
          mkdocs build --strict            # -> ./site
          mkdir -p public/docs
          cp website/index.html website/styles.css public/
          cp -r website/assets public/
          cp -r site/. public/docs/
          test -f public/index.html
          test -f public/docs/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
