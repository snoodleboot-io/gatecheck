# hooksmith checks hooksmith. This is the project's own config, and the CI
# `self-host` job runs `hooksmith run full --all-files` against it.
#
# The hooks are CHECK-mode, not auto-fix: a gate's job is to fail on a problem, not
# to silently rewrite your tree (a run that "passes" but modified files is
# confusing, and useless as a CI gate — see the note in the docs on why an empty
# {files} + --fix is a footgun). Run `ruff check --fix` / `ruff format` by hand to
# fix; the hooks verify.

[sources]
default-registry = "https://pypi.org/simple"

# ruff is pinned exactly: reproducible, stable cache key, and offline-capable. The
# same pin is in pyproject.toml's [dev] extra so hooksmith's isolated ruff and the
# ruff the direct CI steps use are byte-identical.
[[hook]]
id    = "ruff"
from  = "pypi:ruff==0.15.20"
run   = "ruff check {files}"
files = "*.py"

[[hook]]
id         = "ruff-format"
from       = "pypi:ruff==0.15.20"
run        = "ruff format --check {files}"
files      = "*.py"
depends-on = ["ruff"]

# mypy needs to import the project's dependencies to type-check, so it runs from the
# project venv rather than an isolated one. No args → it uses [tool.mypy].files.
[[hook]]
id         = "mypy"
from       = "project"
run        = "mypy"
pass-files = false
when       = { env-not = "SKIP_MYPY" }

[[hook]]
id         = "cargo-fmt-check"
from       = "system"
run        = "cargo fmt --manifest-path hooksmith-rs/Cargo.toml -- --check"
pass-files = false

[[hook]]
id         = "cargo-clippy"
from       = "system"
run        = "cargo clippy --manifest-path hooksmith-rs/Cargo.toml -- -D warnings"
pass-files = false
depends-on = ["cargo-fmt-check"]

# Non-interactive secret scan against a committed baseline: fails only on a NEW
# secret not already allowlisted. The baseline's exclude filter skips vendored dirs
# and the agent tooling under .claude/. (Restored in GAT-49 — the previous version
# ran the interactive `audit` against a baseline that didn't exist.)
[[hook]]
id   = "check-secrets"
from = "pypi:detect-secrets==1.5.0"
run  = "detect-secrets-hook --baseline .secrets.baseline {files}"

# Conventional-commit gate on the message itself (GAT-51). Runs from the commit-msg
# hook: git passes the pending message file, which hooksmith forwards as {commit-msg}.
# `cz check` fails a message that doesn't match the conventional format.
[[hook]]
id   = "conventional-commit"
from = "pypi:commitizen==4.16.5"
run  = "cz check --commit-msg-file {commit-msg}"

# Fast checks on commit: lint + rust formatting.
[group.lint]
hooks     = ["ruff", "cargo-fmt-check", "cargo-clippy"]
parallel  = true
fail-fast = false
on-event  = "commit"

# Formatting check on commit.
[group.format]
hooks    = ["ruff-format"]
parallel = false
on-event = "commit"

# Everything, before push — and the group the CI `self-host` job runs.
[group.full]
hooks     = ["ruff", "ruff-format", "mypy", "cargo-fmt-check", "cargo-clippy", "check-secrets"]
parallel  = true
fail-fast = false
on-event  = "push"

# Conventional-commit check on the message. Wired to .git/hooks/commit-msg by
# `hooksmith install`; not part of `full` since it needs the message file, not files.
[group.msg]
hooks    = ["conventional-commit"]
on-event = "commit-msg"
