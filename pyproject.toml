[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatecheck"
# Version is dynamic: sourced from src/gatecheck/__about__.py and injected by CI/CD.
# The release pipeline computes MAJOR.MINOR.PATCH from PyPI history + PR context
# (see .github/scripts/calculate_version.py) and rewrites __about__.py before build.
# Local and editable installs use its 0.0.0.dev0 placeholder.
dynamic = ["version"]
description = "The next-generation runner for git pre-commit actions — real package sources, monorepo support, and Rust-powered parallel execution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["git", "hooks", "pre-commit", "linting", "monorepo", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13",
    "pathspec>=0.12",
    "pydantic>=2",
    "tomlkit>=0.13",
    "packaging>=24",           # PEP 440/508 version + requirement handling (registry resolver)
    "pyyaml>=6",               # parsing .pre-commit-config.yaml (migrate)
    "gatecheck-core>=0.1.0",   # the Rust extension wheel
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "mypy>=1.10",
    "ruff==0.15.20",           # pinned: must match check.toml's ruff hook exactly
    "maturin>=1.5",
    "pyyaml>=6",                # for gatecheck migrate
    "types-PyYAML>=6",          # yaml stubs for mypy
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-macros-plugin>=1.0",
    "mike>=2.0",
]

[project.scripts]
gatecheck = "gatecheck.cli:main"
gc = "gatecheck.cli:main"

[project.urls]
Homepage = "https://gatecheck.dev"
Documentation = "https://gatecheck.dev"
Repository = "https://github.com/snoodleboot-io/gatecheck"
Changelog = "https://gatecheck.dev/changelog/"
Issues = "https://github.com/snoodleboot-io/gatecheck/issues"

[tool.hatch.version]
path = "src/gatecheck/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gatecheck"]

# ── Ruff ──────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",   # line length — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["gatecheck"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/gatecheck"]

# The Rust extension (built by maturin) ships no type stubs / py.typed marker,
# so mypy cannot analyze it. Treat it as untyped at the module level rather than
# scattering inline ignores at every import site.
[[tool.mypy.overrides]]
module = ["gatecheck_core"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that require external tools (git, uv)",
    "network: tests that hit a real network/PyPI (deselected by default)",
]

[tool.coverage.run]
source = ["src/gatecheck"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 85
