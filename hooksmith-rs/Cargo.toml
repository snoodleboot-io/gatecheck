[package]
name        = "hooksmith-core"
version     = "0.1.0"
edition     = "2021"
description = "Native core for hooksmith — DAG runner, cache, git, glob."
license     = "MIT"
repository  = "https://github.com/snoodleboot-io/hooksmith"
rust-version = "1.75"

[lib]
# Required for maturin to build a Python extension module.
name       = "hooksmith_core"
crate-type = ["cdylib"]

[dependencies]
pyo3   = { version = "0.21", features = ["extension-module"] }
rayon  = "1.10"
sha2   = "0.10"
globset = "0.4"

[profile.release]
lto       = "thin"
codegen-units = 1
strip     = true
